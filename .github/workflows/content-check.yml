name: Content Check
on:
  schedule: [{ cron: '0 8 * * *' }]
  workflow_dispatch:
jobs:
  check:
    permissions: { contents: read, issues: write }
    uses: md1god/MD-automation/.github/workflows/reusable-content-check.yml@main
    with:
      required-files: |
        dist/index.html
        dist/404.html
        dist/CNAME
        dist/robots.txt
        dist/sitemap.xml
      min-bytes: '400'
