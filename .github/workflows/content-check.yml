name: Content Check
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'
          cache: npm
      - name: Build and generate crawlable routes
        run: |
          npm ci
          node scripts/check-addresses.mjs
          npm run build
          cp dist/index.html dist/404.html
          node scripts/generate-seo-routes.mjs
      - name: Verify published artifact files
        run: |
          set -e
          for f in dist/index.html dist/404.html dist/CNAME dist/robots.txt dist/sitemap.xml; do
            test -s "$f" || { echo "Missing or empty: $f"; exit 1; }
          done
          test "$(find dist -name index.html | wc -l)" -ge 20
          echo "Content check passed: $(find dist -name index.html | wc -l) crawlable HTML entries."
