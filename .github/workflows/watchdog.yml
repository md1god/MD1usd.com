name: Watchdog
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check latest Deploy workflow
        uses: actions/github-script@v7
        with:
          script: |
            const workflowFile = 'Deploy.yml';
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowFile,
              per_page: 1
            });
            if (!data.workflow_runs.length) {
              core.setFailed(`لم يتم العثور على تشغيل لـ ${workflowFile}.`);
              return;
            }
            const run = data.workflow_runs[0];
            core.info(`آخر تشغيل: ${run.html_url} — ${run.status}/${run.conclusion}`);
            if (run.status === 'completed' && run.conclusion !== 'success') {
              core.setFailed(`آخر نشر فشل: ${run.html_url}`);
            }
