name: Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Generate SPA route entry points
        run: |
          cp dist/index.html dist/404.html
          # GitHub Pages otherwise returns HTTP 404 for BrowserRouter deep links.
          # Publishing an index.html per route keeps direct links crawlable and returns HTTP 200.
          routes=(
            about tokenomics security whitepaper roadmap
            learn/defi-101 learn/islamic-finance learn/blockchain-basics learn/smart-contracts
            learn/wallet-guide learn/security-best-practices learn/glossary
            networks/ethereum networks/polygon networks/bnb networks/solana networks/comparison
            community community/ambassadors community/events community/governance community/voting community/believers
            blog news announcements case-studies media-kit
            support/faq support support/troubleshooting contact careers bug-bounty
            partnerships integrations developers/api developers/resources dashboard hub-services
          )
          for route in "${routes[@]}"; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
          node scripts/generate-seo-routes.mjs
      - name: Verify optimized Crystal Core assets
        run: |
          node - <<'JS'
          const fs = require('fs');
          const path = require('path');
          const root = 'dist/crystal-core';
          const files = fs.readdirSync(path.join(root, 'assets/media'));
          const webp = files.filter(f => f.endsWith('.webp'));
          if (webp.length < 13) throw new Error(`Expected optimized Crystal Core images, found ${webp.length}`);
          const code = [...fs.readdirSync(path.join(root, 'assets')).filter(f => f.endsWith('.js')), 'index.html']
            .map(f => fs.readFileSync(path.join(root, f === 'index.html' ? f : 'assets/' + f), 'utf8')).join('\n');
          const legacy = code.match(/[^\s\"'`]+\.(?:jpg|jpeg|png)(?:[^\s\"'`]*)/g) || [];
          const localLegacy = legacy.filter(url => !/^https?:\/\//.test(url));
          if (localLegacy.length) throw new Error(`Crystal Core still references legacy assets: ${localLegacy.slice(0, 5).join(', ')}`);
          console.log(`Verified ${webp.length} optimized Crystal Core images and no legacy references`);
          JS
          rm -f dist/crystal-core/assets/media/ccgame-arena-aurora-v1.jpg \
            dist/crystal-core/assets/media/ccgame-arena-ember-v1.jpg \
            dist/crystal-core/assets/media/ccgame-arena-obsidian-v2.jpg \
            dist/crystal-core/assets/media/ccgame-arena-sunforge-v2.jpg \
            dist/crystal-core/assets/media/ccgame-fighter-inaya-v1.jpg \
            dist/crystal-core/assets/media/ccgame-fighter-mateo-v1.jpg \
            dist/crystal-core/assets/media/ccgame-lucas-v2.png \
            dist/crystal-core/assets/media/ccgame-yumi-v2.png \
            dist/crystal-core/assets/media/celestial-china-arena.jpg \
            dist/crystal-core/assets/media/celestial-core-king-portrait.jpg \
            dist/crystal-core/assets/media/celestial-core-mark.png \
            dist/crystal-core/assets/media/celestial-egypt-arena.jpg \
            dist/crystal-core/assets/media/celestial-rome-arena.jpg
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './dist'
  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
